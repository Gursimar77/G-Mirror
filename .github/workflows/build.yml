name: Build and Package G-Mirror

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: windows-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Run automated unit tests
      run: |
        pytest tests/ -v

    - name: Generate Icon Assets
      run: |
        python packaging/generate_icons.py

    - name: Build Executable with PyInstaller
      run: |
        pyinstaller packaging/gmirror.spec

    - name: Create Portable Zip
      run: |
        Compress-Archive -Path dist/GMirror/* -DestinationPath dist/GMirror-Windows-x64-Portable.zip

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: GMirror-Windows-x64
        path: dist/GMirror-Windows-x64-Portable.zip

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: dist/GMirror-Windows-x64-Portable.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
